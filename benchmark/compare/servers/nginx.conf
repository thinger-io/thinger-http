# nginx: every route answered by a handler in njs (servers/njs-routes.js), as in the other servers.
# run.sh replaces MODULE_PATH, NJS_ROUTES and WORKERS.
load_module MODULE_PATH;
worker_processes WORKERS;
daemon off;
pid /tmp/compare-nginx.pid;
error_log /tmp/compare-nginx-error.log;
events { worker_connections 4096; }
http {
  access_log off;
  js_import routes from NJS_ROUTES;
  server {
    listen 9085;
    location = /hello { js_content routes.hello; }
    location /v1/users/ { js_content routes.params; }
    location = /v1/echo { client_body_buffer_size 16k; client_body_in_single_buffer on; js_content routes.echo; }
  }
}
