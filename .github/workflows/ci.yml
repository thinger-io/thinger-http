name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Authenticate dependency downloads (CMake FetchContent clones) with the job token:
# anonymous clones hit GitHub rate limits when several jobs run at once
env:
  GIT_CONFIG_COUNT: 1
  GIT_CONFIG_KEY_0: url.https://x-access-token:${{ github.token }}@github.com/.insteadOf
  GIT_CONFIG_VALUE_0: https://github.com/

jobs:
  build-and-test:
    runs-on: [self-hosted, Linux, X64]
    container:
      image: thinger/compiler:mold-latest
      options: --memory=36g --memory-swap=36g

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        id: build
        run: cmake --build build -j$(( $(nproc) / 4 ))

      # The transport matrix (target design §7.1): every [matrix] case on TCP, TLS and a Unix
      # socket, failing on its own. The full ctest run below runs these cases too
      - name: Transport matrix (TCP, TLS, Unix)
        run: build/tests/all_integration_tests "[matrix]"

      - name: Run tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: ctest --test-dir build --output-on-failure --timeout 120
