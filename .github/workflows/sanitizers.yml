name: Sanitizers

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Authenticate dependency downloads (CMake FetchContent clones) with the job token:
# anonymous clones hit GitHub rate limits when several jobs run at once
env:
  GIT_CONFIG_COUNT: 1
  GIT_CONFIG_KEY_0: url.https://x-access-token:${{ github.token }}@github.com/.insteadOf
  GIT_CONFIG_VALUE_0: https://github.com/

jobs:
  sanitizers:
    runs-on: self-hosted
    container:
      image: thinger/compiler:mold-latest
      options: --memory=36g --memory-swap=36g

    steps:
      - uses: actions/checkout@v4

      - name: Configure with sanitizers
        run: cmake -B build -DCMAKE_BUILD_TYPE=Debug -DTHINGER_HTTP_ENABLE_SANITIZERS=ON

      - name: Build
        run: cmake --build build -j$(( $(nproc) / 4 ))

      - name: Run tests
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir build --output-on-failure --timeout 120
