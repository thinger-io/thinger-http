name: Fuzzing

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Authenticate dependency downloads (CMake FetchContent clones) with the job token:
# anonymous clones hit GitHub rate limits when several jobs run at once
env:
  GIT_CONFIG_COUNT: 1
  GIT_CONFIG_KEY_0: url.https://x-access-token:${{ github.token }}@github.com/.insteadOf
  GIT_CONFIG_VALUE_0: https://github.com/

jobs:
  fuzz:
    runs-on: self-hosted
    container:
      image: thinger/compiler:mold-latest
      options: --memory=36g --memory-swap=36g

    env:
      CC: clang
      CXX: clang++

    steps:
      - uses: actions/checkout@v4

      - name: Restore fuzz corpus cache
        uses: actions/cache@v4
        with:
          path: |
            build-fuzz/corpus
          key: fuzz-corpus-${{ github.sha }}
          restore-keys: |
            fuzz-corpus-

      - name: Configure
        run: cmake -B build-fuzz -DCMAKE_BUILD_TYPE=RelWithDebInfo -DTHINGER_HTTP_ENABLE_FUZZING=ON -DTHINGER_HTTP_BUILD_TESTS=OFF -DTHINGER_HTTP_ENABLE_LOGGING=OFF

      - name: Build
        run: cmake --build build-fuzz -j$(( $(nproc) / 4 ))

      - name: Prepare corpus directories
        run: |
          mkdir -p build-fuzz/corpus/http_request_parser
          mkdir -p build-fuzz/corpus/chunked_decoder
          mkdir -p build-fuzz/corpus/http_differential
          mkdir -p build-fuzz/corpus/url_decode
          cp -rn tests/fuzz/corpus/http_request_parser/* build-fuzz/corpus/http_request_parser/ 2>/dev/null || true
          cp -rn tests/fuzz/corpus/chunked_decoder/* build-fuzz/corpus/chunked_decoder/ 2>/dev/null || true
          # The differential target parses the same requests as the request parser target
          cp -rn tests/fuzz/corpus/http_request_parser/* build-fuzz/corpus/http_differential/ 2>/dev/null || true
          cp -rn tests/fuzz/corpus/url_decode/* build-fuzz/corpus/url_decode/ 2>/dev/null || true

      - name: Fuzz HTTP request parser
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: build-fuzz/tests/fuzz/fuzz_http_request_parser build-fuzz/corpus/http_request_parser -max_total_time=300 -max_len=4096

      - name: Fuzz chunked decoder
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: build-fuzz/tests/fuzz/fuzz_chunked_decoder build-fuzz/corpus/chunked_decoder -max_total_time=300 -max_len=4096

      - name: Fuzz HTTP parsing against Boost.Beast (differential)
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: build-fuzz/tests/fuzz/fuzz_http_differential build-fuzz/corpus/http_differential -max_total_time=300 -max_len=4096

      - name: Fuzz URL decode
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: build-fuzz/tests/fuzz/fuzz_url_decode build-fuzz/corpus/url_decode -max_total_time=300 -max_len=4096

      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashes
          path: |
            crash-*
            leak-*
            timeout-*
          retention-days: 30
