name: CodeQL

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '30 4 * * 1'
  workflow_dispatch:

# Authenticate dependency downloads (CMake FetchContent clones) with the job token:
# anonymous clones hit GitHub rate limits when several jobs run at once
env:
  GIT_CONFIG_COUNT: 1
  GIT_CONFIG_KEY_0: url.https://x-access-token:${{ github.token }}@github.com/.insteadOf
  GIT_CONFIG_VALUE_0: https://github.com/

jobs:
  analyze:
    name: Analyze (C++)
    runs-on: [self-hosted, Linux, X64]
    container:
      image: thinger/compiler:mold-latest
      options: --memory=36g --memory-swap=36g

    permissions:
      security-events: write
      actions: read
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: c-cpp
          config-file: ./.github/codeql/codeql-config.yml

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j$(( $(nproc) / 4 ))

      # Everything compiled is analyzed, the downloaded dependencies too: their results are
      # filtered out before the upload (paths-ignore does not apply to compiled languages)
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:c-cpp"
          upload: never
          output: sarif-results

      - name: Keep the results of the project code
        run: python3 .github/scripts/filter_sarif.py sarif-results

      - name: Upload results
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: sarif-results
          category: "/language:c-cpp"
